name: Benchmarks (extended)

# The heavy, exploratory benchmark suite (multi-distribution sweeps, million-item
# scale tests, concurrency fan-out, allocation profiling, cache-locality, and mixed
# workloads). It is deliberately kept OUT of the core suite that benchmarks.yml
# measures after merges to main, because it is slow and noisy. Instead it runs
# weekly and on demand, and publishes (from main only) to its own dev/bench-extended
# dashboard on gh-pages, so its trend never mixes with the per-commit core time series.

on:
  schedule:
    # Mondays 03:23 UTC. Off the hour on purpose: GitHub delays scheduled runs under load and
    # names the start of every hour as a high-load time. At '0 6 * * 1', ten of the eleven
    # runs from 2026-08-31 to 2026-11-09 started five to eight hours late.
    - cron: '23 3 * * 1'
  workflow_dispatch: {}

jobs:
  extended:
    name: extended benchmarks
    # Scheduled runs fire on the default branch of every fork; guard so only the
    # canonical repo actually runs and pushes to its gh-pages.
    if: github.repository == 'marius-bughiu/Celerity'
    runs-on: ubuntu-latest
    # Sized from measured runs, and the host moves the length as much as the suite does.
    # BenchmarkDotNet iterates each case until it is stable, so a noisy runner drives cases to
    # the iteration cap: the same commit (674011a8) ran 114 min on 2026-11-09 and was cut off at
    # the old 120-min cap on 2026-11-02, LargeDatasetBenchmark alone taking 7 min on one run and
    # 17.5 on the other. Seven of the twelve weekly runs from 2026-08-24 to 2026-11-09 were cut
    # off like that. The five that finished took 110-117 min, and the seven extrapolate to
    # 122-142. 240 clears the slowest by ~100 min and stays 2h under GitHub's 6h job ceiling.
    # The summary step warns when a run passes 180 min. Past that, cap the iteration count in
    # ExtendedCiConfig (trading some accuracy on noisy hosts) or shard the suite as
    # benchmarks.yml shards the core one, rather than raising this again.
    timeout-minutes: 240

    permissions:
      contents: write

    defaults:
      run:
        working-directory: src

    steps:
      # NOTE: do NOT add `filter: tree:0` here. A blobless partial clone breaks
      # github-action-benchmark's own `git fetch origin gh-pages:gh-pages` with
      # "missing blob object … did not send all necessary objects" and aborts the
      # gh-pages publish (#217), exactly as it did in benchmarks.yml.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run extended benchmarks
        # working-directory must be the project folder, not src/. BenchmarkDotNet
        # writes its artifacts to ./BenchmarkDotNet.Artifacts relative to the
        # process CWD, and downstream steps look for them under Celerity.Benchmarks/.
        working-directory: src/Celerity.Benchmarks
        run: dotnet run --configuration Release -- --ci-extended

      - name: Stage benchmark report
        # The joined-run JSON is named with a timestamp
        # (BenchmarkRun-joined-<ts>-report-full.json). Copy it to a stable path.
        run: |
          set -euo pipefail
          report=$(ls Celerity.Benchmarks/BenchmarkDotNet.Artifacts/results/*-report-full.json | head -n 1)
          echo "Found report: $report"
          cp "$report" Celerity.Benchmarks/BenchmarkDotNet.Artifacts/results/extended-report-full.json

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-benchmark-results
          path: src/Celerity.Benchmarks/BenchmarkDotNet.Artifacts/**
          if-no-files-found: warn
          retention-days: 90

      # One row per class from BenchmarkDotNet's own per-class "Run time" line, so sizing the
      # timeout above reads off the job summary instead of a ~40k-line log. Non-fatal, because a
      # diagnostics step must never cost the measurement, and ahead of the publish step so its
      # table is not buried under that step's one row per benchmark. It runs on a timed-out run
      # too, where the classes that finished are the useful part; the log on disk trails the
      # console by a buffer, so the class it names as unfinished is approximate there.
      - name: Summarize per-class wall time
        if: always()
        continue-on-error: true
        working-directory: src/Celerity.Benchmarks
        run: |
          set -euo pipefail
          # Keep in sync with timeout-minutes above.
          cap=240
          log=$(ls BenchmarkDotNet.Artifacts/*.log | head -n 1)
          total=$(grep -m1 '^Global total time' "$log" || true)
          {
            echo "### Extended suite — per-class wall time"
            echo
            echo "| Class | Cases | Minutes |"
            echo "|---|--:|--:|"
            awk '
              /^\/\/ Benchmark: / { split($3, part, "."); cls = part[1] }
              /^Run time: / { secs = $4; sub(/^\(/, "", secs); printf "%s\t%d\t%.1f\n", cls, $NF, secs / 60 }
            ' "$log" | sort -t$'\t' -k3,3nr | awk -F'\t' '{ printf "| %s | %s | %s |\n", $1, $2, $3 }'
            echo
            # A run cut off by the timeout never prints its global total; name where it stopped.
            if [ -n "$total" ]; then
              echo "$total"
            else
              awk '/^\/\/ Benchmark: / { split($3, part, "."); cls = part[1] } END { print "No global total: the run stopped during " cls "." }' "$log"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # Nothing reads a job summary unprompted, which is how two months of timeouts went
          # unnoticed, so a run within an hour of the cap also says so as an annotation on the run.
          if [ -n "$total" ]; then
            minutes=$(echo "$total" | sed -E 's/.*\(([0-9.]+) sec\).*/\1/' | awk '{ printf "%d", $1 / 60 }')
            if [ "${minutes:-0}" -ge $((cap - 60)) ]; then
              echo "::warning title=Extended suite near its timeout::The suite ran ${minutes} of the job's ${cap} minutes. Re-size it before it is cut off; see the comment on timeout-minutes."
            fi
          fi

      - name: Publish to gh-pages (dev/bench-extended)
        # Gated on the ref rather than the event, as benchmarks.yml gates its publish: the weekly
        # run and a manual run against `main` publish, while a manual run against any other ref
        # measures and uploads its artifact without adding a point for a commit `main` may never
        # contain.
        if: github.ref == 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Celerity Extended Benchmarks
          tool: 'benchmarkdotnet'
          output-file-path: src/Celerity.Benchmarks/BenchmarkDotNet.Artifacts/results/extended-report-full.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          comment-on-alert: false
          comment-always: false
          summary-always: true
          # Exploratory weekly trend on noisy hosted runners — never fail the run.
          fail-on-alert: false
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench-extended
