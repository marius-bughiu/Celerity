name: Benchmarks

# Post-merge only. The suite is by a wide margin the most expensive thing in this
# repository's CI, and running it per pull request meant paying for it again on every
# review commit — the head *and* a same-runner `main` base, twice over eight runners, for
# numbers nobody read until the PR settled. What it actually protects is the published
# time series, and that is a property of `main`, so `main` is where it is measured.
#
# What is given up is the per-PR A/B comment: a regression is now seen on the merge commit
# that introduced it rather than on the PR that proposed it. That is a deliberate trade —
# the dashboard still names the commit, and a perf-motivated change is expected to carry
# local before/after numbers in its PR description (see CONTRIBUTING.md).
#
# `workflow_dispatch` is the escape hatch: run the suite on demand against any ref when a
# change wants measuring before it merges.
on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/workflows/benchmarks.yml'
  workflow_dispatch: {}

# Each commit is its own group, so a run is never cancelled by the next push: every
# commit's numbers are independently meaningful on this path, and a cancelled run would
# leave a hole in the gh-pages time series.
concurrency:
  group: benchmarks-${{ github.sha }}
  cancel-in-progress: false

# The core suite is ~300 cases and, at full BenchmarkDotNet accuracy (Job.Default x2
# launches, see CiConfig.cs), one pass takes ~3h — past GitHub's 6h job ceiling once, when
# this workflow also measured a base (#217). Rather than trade away measurement accuracy,
# we shard the suite across a parallel matrix: each shard measures only its slice on its
# own runner, so wall time is ~3h / SHARD_TOTAL at full accuracy, and an aggregate job
# stitches the per-shard JSON back together for the gh-pages publish.
env:
  # Keep in sync with the matrix.shard list below.
  SHARD_TOTAL: '8'

jobs:
  # The `paths: src/**` trigger above is a path filter, not a semantic one: an XML
  # doc-comment edit is a `src/**` change and buys a full sharded run for a diff with zero
  # IL in it. This job is the semantic half — it refuses to spend eight runners on a diff
  # that provably cannot move a measured number.
  #
  # The gate used to run on pull requests only, on the reasoning that `main` must always
  # measure so the published series never gains a hole. That reasoning does not survive the
  # move to post-merge: a docs commit is now the *only* thing the gate ever sees, and the
  # series it protects gains nothing from a point that re-measures identical IL. A skipped
  # commit simply has no point of its own; the next code commit publishes the next one.
  changes:
    name: relevance gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    outputs:
      run_benchmarks: ${{ steps.gate.outputs.run }}

    steps:
      # fetch-depth: 0 so the script can resolve the merge base of the two push SHAs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this diff can move a measured number
        id: gate
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A manual run is an explicit request to measure, so it is never gated. Same for
          # a push whose predecessor is unresolvable — a branch's first push reports the
          # all-zero SHA, and a force-push can leave `before` unreachable. Every unknown
          # resolves toward measuring: a wrong "run" costs runner minutes, a wrong "skip"
          # costs a point in the series.
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "${{ github.event_name }} — an explicit request to measure, never gated."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${BEFORE_SHA}" ] || [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "No resolvable predecessor for this push (${BEFORE_SHA:-unset}) — measuring."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/benchmark_relevant_changes.js "${BEFORE_SHA}" "${AFTER_SHA}"

  benchmark-shard:
    name: benchmark (shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.run_benchmarks == 'true'
    runs-on: ubuntu-latest
    # Sized from the measured slices at SHARD_TOTAL=8, which ran 45.8-67.3 min. The cap was
    # 180 min when a job also replayed its slice against a `main` base and so cost about
    # twice its slice; measuring one side halves that, and 120 min leaves room for the
    # suite to grow into. Re-measure if slices approach 90 min; at that point the fix is to
    # split the 81-case StringHasherBenchmark, which is a single class and therefore floors
    # the heaviest slice no matter how many shards there are.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Must enumerate 0 .. SHARD_TOTAL-1.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    permissions:
      contents: read

    defaults:
      run:
        working-directory: src

    steps:
      # NOTE: do NOT add `filter: tree:0` here. A blobless partial clone makes the repo
      # advertise every commit as "have" while missing the underlying objects, which breaks
      # github-action-benchmark's own gh-pages fetch in the aggregate job with "missing blob
      # object … did not send all necessary objects" (#217).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run benchmarks (shard ${{ matrix.shard }})
        # working-directory must be the project folder, not src/. BenchmarkDotNet writes
        # its artifacts to ./BenchmarkDotNet.Artifacts relative to the process CWD.
        working-directory: src/Celerity.Benchmarks
        run: >-
          dotnet run --configuration Release --
          --ci --shard "${SHARD_TOTAL}" "${{ matrix.shard }}"

      - name: Stage report
        run: |
          set -euo pipefail
          mkdir -p /tmp/reports
          report=$(ls Celerity.Benchmarks/BenchmarkDotNet.Artifacts/results/*-report-full.json | head -n 1)
          cp "$report" "/tmp/reports/shard-${{ matrix.shard }}.json"
          echo "Staged shard ${{ matrix.shard }}: $report"

      - name: Upload shard reports
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-shard-${{ matrix.shard }}
          path: /tmp/reports/**
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: aggregate & report
    needs: [changes, benchmark-shard]
    # Run even if some shards were cancelled or failed so partial results are still
    # published where possible — but say loudly which shards are missing (see the merge
    # step), because a partial report otherwise reads exactly like a complete one.
    if: always() && needs.changes.outputs.run_benchmarks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-shard-*
          merge-multiple: true
          path: /tmp/reports

      - name: Merge shard reports
        id: merge
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Name the shards that did not report before anything else. `if: always()` means
          # this job runs on a partial matrix, and the merged report is then legitimately
          # missing whole benchmark classes. Nothing downstream could tell.
          missing=""
          for s in $(seq 0 $((SHARD_TOTAL - 1))); do
            if [ ! -f "/tmp/reports/shard-${s}.json" ]; then
              missing="${missing}${missing:+, }${s}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::warning title=Incomplete benchmark report::Shard(s) ${missing} produced no report; the published point is missing every benchmark class packed onto them."
          fi
          echo "missing_shards=${missing}" >> "$GITHUB_OUTPUT"

          report_files=(/tmp/reports/shard-*.json)
          if [ ${#report_files[@]} -eq 0 ]; then
            echo "No shard reports found (all shards cancelled/failed) — nothing to publish."
            echo "have_report=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "have_report=true" >> "$GITHUB_OUTPUT"
          echo "shard_count=${#report_files[@]}" >> "$GITHUB_OUTPUT"

          # Stitch every shard's joined report back into one: keep shard 0's metadata,
          # concatenate all shards' Benchmarks arrays.
          jq -s '.[0] * {Benchmarks: ([.[].Benchmarks] | add)}' "${report_files[@]}" > /tmp/merged-report-full.json
          echo "Merged $(jq '.Benchmarks | length' /tmp/merged-report-full.json) benchmarks from ${#report_files[@]} shard(s)."

      - name: Upload merged report
        if: steps.merge.outputs.have_report == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: /tmp/*-report-full.json
          if-no-files-found: warn
          retention-days: 30

      # ----- Publish the merged report to gh-pages -----
      #
      # Gated on the ref rather than the event so a `workflow_dispatch` run against `main`
      # publishes like a push does, while one against any other ref measures and uploads
      # its artifact without touching the series.
      - name: Stage merged report for publish
        if: github.ref == 'refs/heads/main' && steps.merge.outputs.have_report == 'true'
        run: |
          set -euo pipefail
          mkdir -p src/Celerity.Benchmarks/BenchmarkDotNet.Artifacts/results
          cp /tmp/merged-report-full.json src/Celerity.Benchmarks/BenchmarkDotNet.Artifacts/results/ci-report-full.json

      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/main' && steps.merge.outputs.have_report == 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Celerity Benchmarks
          tool: 'benchmarkdotnet'
          output-file-path: src/Celerity.Benchmarks/BenchmarkDotNet.Artifacts/results/ci-report-full.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          comment-on-alert: false
          comment-always: false
          summary-always: true
          fail-on-alert: false
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench

      - name: Sync custom dashboard to gh-pages
        # Copies web/index.html + web/dev/bench/*.html into gh-pages, leaving the
        # action-managed data.js untouched. Idempotent.
        if: github.ref == 'refs/heads/main' && steps.merge.outputs.have_report == 'true'
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages gh-pages
          cp web/index.html /tmp/gh-pages/index.html
          mkdir -p /tmp/gh-pages/dev/bench
          cp web/dev/bench/index.html /tmp/gh-pages/dev/bench/index.html
          cp web/dev/bench/detail.html /tmp/gh-pages/dev/bench/detail.html
          cd /tmp/gh-pages
          if git diff --quiet && git diff --cached --quiet; then
            echo "No dashboard changes to sync"
            exit 0
          fi
          git -c user.name="github-actions" -c user.email="github-actions@github.com" \
            add index.html dev/bench/index.html dev/bench/detail.html
          git -c user.name="github-actions" -c user.email="github-actions@github.com" \
            commit -m "Sync custom dashboard from ${GITHUB_SHA:0:7}"
          git push origin gh-pages

      # Deliberately the LAST step: a dashboard-wiring mistake must not cost us the
      # measurement, so the gh-pages publish above happens first and this only reddens the
      # job. Skipped unless every shard reported, since a partial merge is legitimately
      # missing whole benchmark classes (the job runs with if: always()).
      - name: Check dashboard coverage of the merged report
        if: steps.merge.outputs.have_report == 'true' && steps.merge.outputs.shard_count == env.SHARD_TOTAL
        run: node scripts/check_dashboard_coverage.js /tmp/merged-report-full.json
